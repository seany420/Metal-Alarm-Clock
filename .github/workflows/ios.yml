name: iOS app

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build
        run: |
          cd ios
          set +e
          xcodebuild -project MetalAlarm.xcodeproj -scheme MetalAlarm \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          code=$?
          grep -E "error:|warning:.*(deprecated|AlarmKit)|BUILD (SUCCEEDED|FAILED)" build.log | sort -u
          exit $code

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MetalAlarm.app Payload/
          zip -qry MetalAlarm-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MetalAlarm-unsigned-ipa
          path: ios/MetalAlarm-unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log

  testflight:
    name: Sign and send to TestFlight
    needs: build
    # Turns on once the repo has a TEAM_ID variable (Settings > Secrets and variables > Actions > Variables).
    if: ${{ vars.TEAM_ID != '' }}
    runs-on: macos-26
    env:
      TEAM_ID: ${{ vars.TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.seany420.metalalarm' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Write App Store Connect key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Archive
        run: |
          cd ios
          xcodebuild -project MetalAlarm.xcodeproj -scheme MetalAlarm -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/MetalAlarm.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

      - name: Upload to TestFlight
        run: |
          cd ios
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/MetalAlarm.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
